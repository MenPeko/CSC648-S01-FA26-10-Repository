<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Team {{ team.number }}{% endblock %} &middot; CSC 648 Team {{ team.number }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="site-header__home" href="{{ url_for('main.index') }}">
      <span class="site-header__course">{{ team.course }}</span>
      <span class="site-header__school">{{ team.school }}</span>
    </a>
    <p class="site-header__meta">
      {{ team.semester }} &middot; Section {{ team.section }} &middot; Team {{ team.number }}
    </p>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>CSC 648-848 Software Engineering &middot; {{ team.semester }} &middot; Team {{ team.number }}</p>
  </footer>
</body>
</html>
