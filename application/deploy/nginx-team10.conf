# Nginx site for the Team 10 server.
# Install with:
#   sudo cp deploy/nginx-team10.conf /etc/nginx/sites-available/team10
#   sudo ln -sf /etc/nginx/sites-available/team10 /etc/nginx/sites-enabled/team10
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Note: the EC2 public hostname below changes if the instance is stopped and
# started without an Elastic IP. Update server_name here if that happens.
# Let's Encrypt will not issue certificates for *.amazonaws.com names, so HTTPS
# requires a domain we own; see the deployment section of application/README.md.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ec2-13-52-242-59.us-west-1.compute.amazonaws.com 13.52.242.59;

    access_log /var/log/nginx/team10.access.log;
    error_log  /var/log/nginx/team10.error.log;

    # Nginx serves static assets directly; Gunicorn never sees these requests.
    location /static/ {
        alias /srv/CSC648-S01-FA26-10-Repository/application/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
